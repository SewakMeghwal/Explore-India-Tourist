{% extends 'base.html' %}

{% block title %}Login - Tourist Places Portal{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <i class="fa fa-user-circle fa-3x text-primary mb-2"></i>
                    <h2 class="fw-bold">Sign In</h2>
                    <p class="text-muted">Enter your credentials to access your account</p>
                </div>

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa fa-user text-muted"></i></span>
                            <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter username" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa fa-lock text-muted"></i></span>
                            <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter password" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                            <i class="fa fa-sign-in me-1"></i> Login
                        </button>
                    </div>
                </form>

                <div class="text-center mt-3 pt-3 border-top">
                    <p class="mb-0 text-muted">Don't have an account? 
                        <a href="{% url 'register' %}" class="text-primary fw-semibold text-decoration-none">Sign Up Here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
