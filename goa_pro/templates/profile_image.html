{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Upload Profile Picture - Tourist Places{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <i class="fa fa-camera fa-3x text-primary mb-2"></i>
                    <h3 class="fw-bold">Profile Picture</h3>
                    <p class="text-muted">Upload or update your profile avatar</p>
                </div>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                            <i class="fa fa-upload"></i> Upload Image
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-3">
                    <a href="{% url 'profile' %}" class="text-secondary text-decoration-none">
                        <i class="fa fa-arrow-left"></i> Back to Profile
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
