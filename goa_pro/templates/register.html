{% extends 'base.html' %}

{% block title %}Register - Tourist Places Portal{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <i class="fa fa-user-plus fa-3x text-success mb-2"></i>
                    <h2 class="fw-bold">Create Account</h2>
                    <p class="text-muted">Register yourself to explore tourist destinations</p>
                </div>

                <form method="post" action="{% url 'register' %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa fa-user text-muted"></i></span>
                            <input type="text" name="username" id="id_username" class="form-control" placeholder="Choose a username" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="id_email" class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa fa-envelope text-muted"></i></span>
                            <input type="email" name="email" id="id_email" class="form-control" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa fa-lock text-muted"></i></span>
                            <input type="password" name="password" id="id_password" class="form-control" placeholder="Create password" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="id_c_password" class="form-label fw-semibold">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa fa-check-square-o text-muted"></i></span>
                            <input type="password" name="c_password" id="id_c_password" class="form-control" placeholder="Confirm password" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-success btn-lg shadow-sm">
                            <i class="fa fa-user-plus me-1"></i> Register Now
                        </button>
                    </div>
                </form>

                <div class="text-center mt-3 pt-3 border-top">
                    <p class="mb-0 text-muted">Already have an account? 
                        <a href="{% url 'login' %}" class="text-success fw-semibold text-decoration-none">Sign In Here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
